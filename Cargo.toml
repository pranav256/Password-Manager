[package]
name = "rusty-vault"
version = "0.1.0"
edition = "2021"
authors = ["Pranav <pranav256>"]
description = "A modern, secure, and lightweight desktop password manager written in Rust"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.29"
directories = "5.0"

[dev-dependencies]
tempfile = "3.10"
