[package]
name = "rusty-vault"
version = "0.1.0"
edition = "2021"
authors = ["Pranav <pranav256>"]
description = "A modern, secure, and lightweight desktop password manager written in Rust"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
