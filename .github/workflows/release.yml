name: Release Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rusty-vault.exe
            archive: RustyVault-v0.1.0-Windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: rusty-vault
            archive: RustyVault-v0.1.0-Linux-x86_64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: rusty-vault
            archive: RustyVault-v0.1.0-macOS-x86_64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Archive
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} .
          7z a ${{ matrix.archive }} ${{ matrix.binary }} README.md LICENSE

      - name: Package Unix Archive
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} .
          tar -czvf ${{ matrix.archive }} ${{ matrix.binary }} README.md LICENSE

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
